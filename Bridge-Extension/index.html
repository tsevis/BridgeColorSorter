<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>ColorXBridge</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="panel">
    <header class="header">
      <h1>ColorXBridge</h1>
      <span id="hostInfo" class="host"></span>
    </header>

    <section class="actions">
      <button id="analyzeBtn" class="btn btn-primary">Analyse selection</button>
      <button id="analyzeAllBtn" class="btn">Analyse whole folder</button>
    </section>

    <section class="progress-section" id="progressSection" style="display:none">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text"></span>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Order</h2>
      </div>
      <div class="fields">
        <label class="field-col">
          <span class="field-label">Order by</span>
          <select id="sortModeSelect" class="select">
            <option value="criteria">Colour criteria</option>
            <option value="similarity">Whole-palette similarity</option>
          </select>
        </label>
      </div>
      <p id="modeNote" class="note"></p>

      <div id="criteriaBlock">
      <p class="hint">Tick the criteria to sort by. They apply top to bottom —
        the first is the primary sort, the rest break ties. Measured in
        <strong>OKLCH</strong>, so equal steps look equal.</p>

      <div id="criteria" class="criteria">
        <label class="criterion">
          <input type="checkbox" data-criterion="hue" checked>
          <span class="criterion-name">Hue</span>
          <button class="dir" data-dir="hue" title="Click to reverse this criterion"></button>
        </label>
        <label class="criterion">
          <input type="checkbox" data-criterion="chroma">
          <span class="criterion-name">Chroma (saturation)</span>
          <button class="dir" data-dir="chroma" title="Click to reverse this criterion"></button>
        </label>
        <label class="criterion">
          <input type="checkbox" data-criterion="lightness" checked>
          <span class="criterion-name">Lightness</span>
          <button class="dir" data-dir="lightness" title="Click to reverse this criterion"></button>
        </label>
        <label class="criterion">
          <input type="checkbox" data-criterion="dominance">
          <span class="criterion-name">Dominance</span>
          <button class="dir" data-dir="dominance" title="Click to reverse this criterion"></button>
        </label>
      </div>

      <div class="fields">
        <label class="field-col">
          <span class="field-label">Grouping</span>
          <select id="groupingSelect" class="select">
            <option value="fine">Fine</option>
            <option value="medium">Medium</option>
            <option value="coarse">Coarse</option>
          </select>
        </label>
        <label class="field-col">
          <span class="field-label">Hue groups</span>
          <select id="hueBandsSelect" class="select">
            <option value="family">Colour families</option>
            <option value="fixed">Equal arcs</option>
            <option value="adaptive">Fit to this folder</option>
          </select>
        </label>
        <label class="field-col checkline">
          <input type="checkbox" id="serpentineToggle" checked>
          <span>Smooth transitions</span>
        </label>
      </div>
      </div>

      <div class="fields">
        <label class="field-col">
          <span class="field-label">Colour used</span>
          <select id="representativeSelect" class="select">
            <option value="balanced">Balanced</option>
            <option value="dominant">Dominant only</option>
            <option value="average">Average</option>
          </select>
        </label>
      </div>

      <div class="actions-grid">
        <button id="sortBtn" class="btn btn-small">Sort list</button>
        <button id="selectInBridgeBtn" class="btn btn-small">Select in Bridge</button>
        <button id="renameBtn" class="btn btn-primary btn-small">Number files…</button>
        <button id="undoRenameBtn" class="btn btn-small">Undo rename</button>
      </div>
      <p id="renamePreview" class="note"></p>
      <p id="sortNote" class="note"></p>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Colours</h2>
        <button id="clearFilterBtn" class="link">clear</button>
      </div>
      <div id="colorSwatches" class="swatches">
        <div class="placeholder">Analyse images to see colours</div>
      </div>
    </section>

    <section class="block grow">
      <div class="block-head">
        <h2>Results</h2>
        <span id="resultCount" class="count"></span>
      </div>
      <div id="resultsList" class="results">
        <div class="placeholder">No results yet</div>
      </div>
    </section>

    <section class="block">
      <details>
        <summary>Settings</summary>
        <div class="settings">
          <label class="field">
            <span>Colours per image</span>
            <input type="number" id="colorCountInput" min="2" max="12" value="5">
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="writeXmpToggle" checked>
            <span>Write colour data to XMP</span>
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="writeKeywordsToggle" checked>
            <span>Add colour keywords (Filter panel)</span>
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="forceReanalyseToggle">
            <span>Re-analyse, ignoring saved colour data</span>
          </label>
          <button id="resetBtn" class="btn btn-small">Clear results</button>
        </div>
      </details>
    </section>

    <footer class="footer">
      <span id="statusText" class="status">Starting…</span>
    </footer>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/colorNames.js"></script>
  <script src="js/naming.js"></script>
  <script src="js/storedPalette.js"></script>
  <script src="js/hueBands.js"></script>
  <script src="js/analyzer/ColorEngine.js"></script>
  <script src="js/similarity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
